name: Tu Dong Build APK Android - Minh Satori

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: 1. Kiem tra ma nguon (Checkout)
      uses: actions/checkout@v4

    - name: 2. Cai dat moi truong Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Cai dat Android SDK
      uses: android-actions/setup-android@v3

    - name: 4. Bien dich file APK bang Gradle
      run: |
        if [ -d "MinhSatori_Android_App" ]; then
          cd MinhSatori_Android_App
        fi
        chmod +x gradlew || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: 5. Xuat file APK cho nguoi dung tai ve
      uses: actions/upload-artifact@v4
      with:
        name: MinhSatori_v6_Android_App
        path: |
          **/app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
        retention-days: 60
