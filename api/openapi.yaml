openapi: 3.1.0
info:
  title: Minh Satori API
  version: 1.0.0
  description: API for trusted external bots. Legacy Google Drive cutover must be verified before live writes.
servers:
  - url: https://YOUR-API-HOST.example.com
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-api-key
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Unique per write request; repeated identical requests return same result.
      schema: {type: string, minLength: 8, maxLength: 128}
    Customer:
      in: query
      name: customer
      schema: {type: string}
    Phone:
      in: query
      name: phone
      schema: {type: string}
    From:
      in: query
      name: from
      schema: {type: string, format: date}
    To:
      in: query
      name: to
      schema: {type: string, format: date}
  schemas:
    Item:
      type: object
      required: [product, qty, unitPrice]
      properties:
        code: {type: string}
        product: {type: string}
        qty: {type: number, exclusiveMinimum: 0}
        unitPrice: {type: number, minimum: 0}
    OrderInput:
      type: object
      required: [date, name, items]
      properties:
        date: {type: string, description: YYYY-MM-DD or DD/MM/YYYY}
        name: {type: string}
        phone: {type: string}
        location: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/Item'}
        shippingAmount: {type: number, minimum: 0}
        vatAmount: {type: number, minimum: 0}
        total: {type: number, minimum: 0}
        status:
          type: string
          enum: [Chưa thanh toán, Đã thanh toán, Đã TT Satori, Đã hủy, Không Tính]
    PaymentInput:
      type: object
      required: [expectedVersion, status]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [Đã thanh toán, Chưa thanh toán]}
    StoredOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        invoiceNo: {type: integer}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
        order: {type: object, additionalProperties: true}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
paths:
  /healthz:
    get:
      security: []
      summary: Service health
      responses:
        '200': {description: Healthy}
  /v1/status:
    get:
      summary: Source-of-truth import status
      responses:
        '200': {description: State and count}
  /v1/orders:
    get:
      summary: Search invoices
      parameters:
        - {$ref: '#/components/parameters/Customer'}
        - {$ref: '#/components/parameters/Phone'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200}
        - in: query
          name: page
          schema: {type: integer, minimum: 0}
      responses:
        '200': {description: Orders, total count and page}
        '503': {description: Legacy migration not complete}
    post:
      summary: Create invoice, assign invoice number server-side
      description: Requires orders:write. Paid invoices additionally require payments:write.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoredOrder'}
        '409': {description: Duplicate idempotency key with changed payload}
  /v1/orders/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Read invoice and version
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoredOrder'}
    patch:
      summary: Update approved invoice fields with optimistic concurrency
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1}
                phone: {type: string}
                name: {type: string}
                date: {type: string}
                location: {type: string}
                items: {type: array, items: {$ref: '#/components/schemas/Item'}}
                total: {type: number}
      responses:
        '200': {description: Updated invoice}
        '409': {description: Version conflict}
  /v1/orders/{id}/payment:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      summary: Mark customer's invoice paid or unpaid
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentInput'}
      responses:
        '200': {description: Payment updated}
        '409': {description: Version conflict}
  /v1/orders/export.csv:
    get:
      summary: Export matching invoices to Excel-safe CSV
      parameters:
        - {$ref: '#/components/parameters/Customer'}
        - {$ref: '#/components/parameters/Phone'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {description: CSV export of up to 10000 invoices}
  /v1/customers:
    get:
      summary: Find customers across invoices
      parameters:
        - in: query
          name: query
          schema: {type: string}
      responses:
        '200': {description: Customer aggregates}
  /v1/debts:
    get:
      summary: Calculate customer debts from unpaid invoices
      parameters:
        - {$ref: '#/components/parameters/Customer'}
        - {$ref: '#/components/parameters/Phone'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {description: Invoice count and total unpaid amount}
  /v1/audit:
    get:
      summary: Owner-only audit log
      responses:
        '200': {description: Change history}
  /v1/admin/legacy/preview:
    post:
      summary: Validate verified Google Drive snapshot without writing
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Preview checksum, counts and invalid dates}
  /v1/admin/legacy/import:
    post:
      summary: Atomic one-time legacy import with complete backup
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot, checksum, expectedCount, sourceRevision]
              properties:
                snapshot: {type: object}
                checksum: {type: string}
                expectedCount: {type: integer}
                sourceRevision: {type: string}
      responses:
        '201': {description: Imported, immutable backup saved}
        '409': {description: Data store already initialized}
