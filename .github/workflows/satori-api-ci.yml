name: Minh Satori API checks
on:
  push:
    branches: [feature/satori-api-v1]
    paths: [api/**, .github/workflows/satori-api-ci.yml]
  pull_request:
    paths: [api/**, .github/workflows/satori-api-ci.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Core tests
        run: npm test
