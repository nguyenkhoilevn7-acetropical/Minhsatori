name: Optional VAT acceptance (fake data only)
on:
  pull_request:
    paths: ['index.html', 'android/**', 'api/**', 'connector/**', 'accounting-core.js', 'tests/**', '.github/workflows/optional-vat-acceptance.yml']
permissions:
  contents: read
jobs:
  node-browser-pdf:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false pdfmake@0.2.10 playwright@1.56.1 acorn@8.15.0
      - run: npx playwright install --with-deps chromium
      - name: Node regression suite (synthetic ledgers)
        run: node --test tests/*.cjs tests/*.test.js tests/*.test.mjs connector/tests/*.test.mjs
      - name: Chromium save and reload E2E (network blocked)
        run: node tests/optional-vat-browser.js
      - name: Byte-for-byte legacy PDF golden
        run: node tests/optional-vat-pdf-golden.cjs
  android-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install API 35 with the runner SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile app and run fake-data unit tests (no APK release)
        run: gradle -p android :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-vat-android-test-reports
          path: android/app/build/reports/tests/
