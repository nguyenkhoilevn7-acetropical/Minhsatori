name: Satori Server Bot API Tests
on:
  push:
    branches:
      - "feature/satori-bot-api-stage1"
      - "feature/minhsatori-native-android-v020"
    paths:
      - "api/**"
      - "tests/satori-bot-api.test.js"
      - "tests/bot-api-restore.cjs"
      - "tests/mobile-api-sandbox.test.cjs"
      - "android/sandbox/**"
      - ".github/workflows/satori-bot-api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/satori-bot-api.test.js"
      - "tests/bot-api-restore.cjs"
      - "tests/mobile-api-sandbox.test.cjs"
      - "android/sandbox/**"
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline HMAC, money, invoice, backup and delete tests
        run: node tests/satori-bot-api.test.js
      - name: Verify mobile sandbox OAuth and fake-only Drive isolation
        run: node tests/mobile-api-sandbox.test.cjs
      - name: Offline restore and trash compatibility tests from main
        run: node tests/bot-api-restore.cjs
