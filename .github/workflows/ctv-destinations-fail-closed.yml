name: CTV Pair Destinations Fail Closed (FAKE only)
on:
  pull_request:
    paths:
      - 'api/BotApi.gs'
      - 'api/tests/ctv-destinations-fail-closed.test.mjs'
      - '.github/workflows/ctv-destinations-fail-closed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-destination-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-approved destination guards without credentials
        run: node --test api/tests/ctv-destinations-fail-closed.test.mjs
