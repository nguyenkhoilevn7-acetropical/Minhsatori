name: Minh Satori Android Release APK (manual, signing secrets required)

on:
  workflow_dispatch:
  # Branch-only acceptance build: the workflow is intentionally not on main.
  # A maintainer explicitly commits this request file AFTER reviewing CI/staging.
  push:
    branches:
      - 'feature/minhsatori-native-android-v020'
      - 'release/android-v0.3.7-ui-ledger-20261022'
      - 'release/android-v0.3.8-owner-live-readonly-20261022'
      - 'release/android-v0.3.9-ctv-pair-readonly-20261023'
      - 'release/android-v0.4.0-owner-auto-sync-20261023'
      - 'release/android-v0.4.2-live-sync-trash-20261023'
      - 'release/android-v0.4.4-web-live-refresh-20261024'
      - 'release/android-v0.4.5-drive403-owner-recovery-20261024'
      - 'release/android-v0.4.6-canonical-live-ledger-20261024'
      - 'release/android-v0.4.8-ios-ui-20261025'
      - 'release/android-v0.4.15-circular-logo-20261028'
      - 'release/android-v0.4.16-rounded-square-logo-20261028'
      - 'release/android-v0.4.17-moneymind-owner-ui-20261028'
      - 'release/android-v0.4.18-right-drawer-20261028'
      - 'release/android-v0.4.19-sales-kpi-red-invoices-20261028'
      - 'release/android-v0.4.26-new-invoice-badge-20261030'
      # Owner-approved staging-only signed APK acceptance; never auto-deploy.
      - 'feature/android-accounting-pro-v0427-signed-acceptance-20261030'
      - 'feature/android-accounting-pro-hide-three-cards-v0428-20261030'
      - 'feature/android-accounting-pro-profit45-v0429-signed-20261030'
      - 'feature/android-debt-profit-unified-filter-20261030'
      - 'feature/android-owner-invoice-edit-v0431-20261030'
      - 'feature/android-invoice-status-profit-badge-v0432-20261030'
      - 'feature/android-invoice-compact-icons-v0433-20261030'
      - 'feature/android-zalo-icon-parse-fix-v0434-20261030'
      - 'feature/android-fold-responsive-invoice-actions-v0435-20261030'
      - 'feature/android-invoice-actions-right-aligned-v0436-20261030'
      - 'feature/android-cancelled-invoice-status-precedence-v0437-20261030'
      - 'feature/android-noncounted-invoice-zero-display-v0438-20261030'
      - 'feature/remove-accounting-pro-android-20261031'
      - 'fix/android-unread-invoice-card-ack-20261101'
      - 'fix/android-invoice-notification-open-20261101'
      - 'release/android-v0.4.20-native-v2-crm-20261029'
      - 'release/android-v0.4.13-customer-info-20261027'
      - 'release/android-v0.4.14-owner-edit-payment-20261027'
    paths:
      - 'android/release-request.json'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify release identity checks
        run: python3 -m unittest discover -s android/tools -p 'test_*.py' -v
      - name: Require pinned public release certificate before loading secrets
        env:
          RELEASE_CERT_SHA256: ${{ vars.SATORI_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-fA-F]{64}", os.environ["RELEASE_CERT_SHA256"]), "Set SATORI_ANDROID_SIGNING_CERT_SHA256 to the stable release certificate SHA-256 (64 hex characters)"'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load private, persistent signing key from GitHub Secrets
        shell: bash
        env:
          SATORI_ANDROID_KEYSTORE_BASE64: ${{ secrets.SATORI_ANDROID_KEYSTORE_BASE64 }}
          SATORI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SATORI_ANDROID_KEYSTORE_PASSWORD }}
          SATORI_ANDROID_KEY_ALIAS: ${{ secrets.SATORI_ANDROID_KEY_ALIAS }}
          SATORI_ANDROID_KEY_PASSWORD: ${{ secrets.SATORI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SATORI_ANDROID_KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          test -n "$SATORI_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing signing password secret"; exit 1; }
          test -n "$SATORI_ANDROID_KEY_ALIAS" || { echo "Missing signing alias secret"; exit 1; }
          test -n "$SATORI_ANDROID_KEY_PASSWORD" || { echo "Missing signing key password secret"; exit 1; }
          printf '%s' "$SATORI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/satori-release.jks"
          chmod 600 "$RUNNER_TEMP/satori-release.jks"
          echo "SATORI_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/satori-release.jks" >> "$GITHUB_ENV"
      - name: Refuse a push-required release without public Firebase config
        env:
          SATORI_FCM_APP_ID: ${{ vars.SATORI_FCM_APP_ID }}
          SATORI_FCM_API_KEY: ${{ vars.SATORI_FCM_API_KEY }}
          SATORI_FCM_PROJECT_ID: ${{ vars.SATORI_FCM_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re
          req = json.load(open("android/release-request.json"))
          names = ["SATORI_FCM_APP_ID", "SATORI_FCM_API_KEY", "SATORI_FCM_PROJECT_ID"]
          # Same precedence as Gradle: repository variable, else the committed
          # PUBLIC android/firebase-public.properties (never a server key).
          committed = {}
          if os.path.isfile("android/firebase-public.properties"):
              for line in open("android/firebase-public.properties", encoding="utf-8"):
                  line = line.strip()
                  if line and not line.startswith("#") and "=" in line:
                      k, v = line.split("=", 1)
                      committed[k.strip()] = v.strip()
          value = lambda n: os.environ.get(n, "").strip() or committed.get(n, "")
          present = {n: bool(re.fullmatch(r"[A-Za-z0-9_:.-]{6,220}", value(n))) for n in names}
          assert not any(k in committed for k in ("SATORI_FCM_SERVICE_ACCOUNT_JSON", "private_key")), "server credential must never be committed"
          print("FCM public config present:", present)
          if req.get("requiresFcm") is True and not all(present.values()):
              missing = [n for n, ok in present.items() if not ok]
              raise SystemExit("Release requires owner push but GitHub repository variables are missing: " + ", ".join(missing))
          PY
      - name: Test and build signed RELEASE APK
        env:
          SATORI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SATORI_ANDROID_KEYSTORE_PASSWORD }}
          SATORI_ANDROID_KEY_ALIAS: ${{ secrets.SATORI_ANDROID_KEY_ALIAS }}
          SATORI_ANDROID_KEY_PASSWORD: ${{ secrets.SATORI_ANDROID_KEY_PASSWORD }}
          # Public Firebase Android identifiers, NOT service-account secrets.
          SATORI_FCM_APP_ID: ${{ vars.SATORI_FCM_APP_ID }}
          SATORI_FCM_API_KEY: ${{ vars.SATORI_FCM_API_KEY }}
          SATORI_FCM_PROJECT_ID: ${{ vars.SATORI_FCM_PROJECT_ID }}
        run: gradle -p android :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleRelease --no-daemon
      - name: Validate release package, version and signing certificate
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ vars.SATORI_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          python3 android/tools/verify_release.py "$APK" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --certificate-sha256 "$RELEASE_CERT_SHA256" \
            --release-request android/release-request.json \
            --report android/app/build/outputs/apk/release/release-verification.json
      - name: Upload signed APK for Samsung acceptance test
        uses: actions/upload-artifact@v4
        with:
          name: MinhSatori-Samsung-Native-iOS-Light-SIGNED-RELEASE
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/release-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Always remove private signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/satori-release.jks"

  # Owner delivery: the repository is public, so the signed APK is never published
  # in clear. It is encrypted (AES-256 key wrapped with RSA-OAEP-SHA256) for the
  # public key in android/release-delivery-public.pem and attached to a temporary
  # prerelease; only the holder of the private key can decrypt it, verify the
  # apkSha256 from release-verification.json and hand the APK to the owner.
  # Runs in its own job so the signing job keeps read-only repository access.
  deliver-encrypted-apk:
    needs: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: android/release-delivery-public.pem
          sparse-checkout-cone-mode: false
      - name: Skip when no delivery key is configured
        id: key
        run: |
          if [ -s android/release-delivery-public.pem ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: MinhSatori-Samsung-Native-iOS-Light-SIGNED-RELEASE
          path: signed
      - name: Encrypt signed APK for the delivery key
        if: steps.key.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          openssl rand -out key.bin 32
          openssl rand -hex 16 > iv.hex
          openssl enc -aes-256-cbc -K "$(od -An -tx1 -v key.bin | tr -d ' \n')" -iv "$(cat iv.hex)" \
            -in signed/app-release.apk -out out/app-release.apk.enc
          openssl pkeyutl -encrypt -pubin -inkey android/release-delivery-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in key.bin -out out/key.bin.enc
          cp iv.hex out/iv.hex
          cp signed/release-verification.json out/release-verification.json
          rm -f key.bin
      - name: Attach encrypted APK to a temporary prerelease
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;r=json.load(open('out/release-verification.json'));print(f\"{r['versionName']}-build{r['versionCode']}\")")
          tag="apk-delivery-${version}-run${{ github.run_id }}"
          # Keep only the newest encrypted delivery: remove earlier temporary ones.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^apk-delivery-' | while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Encrypted owner APK delivery $version (temporary)" \
            --notes "Encrypted for the owner delivery key; not installable without decryption. Deleted after delivery." \
            out/app-release.apk.enc out/key.bin.enc out/iv.hex out/release-verification.json
