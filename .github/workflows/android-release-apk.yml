name: Minh Satori Android Release APK (manual, signing secrets required)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SATORI_ANDROID_KEYSTORE_BASE64: ${{ secrets.SATORI_ANDROID_KEYSTORE_BASE64 }}
      SATORI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SATORI_ANDROID_KEYSTORE_PASSWORD }}
      SATORI_ANDROID_KEY_ALIAS: ${{ secrets.SATORI_ANDROID_KEY_ALIAS }}
      SATORI_ANDROID_KEY_PASSWORD: ${{ secrets.SATORI_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load private, persistent signing key from GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SATORI_ANDROID_KEYSTORE_BASE64" || { echo "Missing signing keystore secret"; exit 1; }
          test -n "$SATORI_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing signing password secret"; exit 1; }
          test -n "$SATORI_ANDROID_KEY_ALIAS" || { echo "Missing signing alias secret"; exit 1; }
          test -n "$SATORI_ANDROID_KEY_PASSWORD" || { echo "Missing signing key password secret"; exit 1; }
          printf '%s' "$SATORI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/satori-release.jks"
          chmod 600 "$RUNNER_TEMP/satori-release.jks"
          echo "SATORI_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/satori-release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed RELEASE APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Validate release package, version and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/satori-release-badging.txt
          grep -F "package: name='vn.minhsatori.app' versionCode='8' versionName='0.3.1'" /tmp/satori-release-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload signed APK for Samsung acceptance test
        uses: actions/upload-artifact@v4
        with:
          name: MinhSatori-Samsung-Native-v0.3.1-SIGNED-RELEASE
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Always remove private signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/satori-release.jks"
