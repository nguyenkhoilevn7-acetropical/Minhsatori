name: Minh Satori Android UI screenshot (sandbox-only)

on:
  pull_request:
    paths:
      - '.github/workflows/android-native-ui-screenshot.yml'
      - 'android/app/src/main/java/vn/minhsatori/app/NativeMainActivity.kt'
      - 'android/app/src/main/res/values/styles.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch clean app and capture real Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            set -euo pipefail
            gradle -p android :app:assembleDebug --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n vn.minhsatori.app/.NativeMainActivity
            sleep 5
            adb shell screencap -p /sdcard/minhsatori-ui.png
            mkdir -p android/ui-evidence
            adb pull /sdcard/minhsatori-ui.png android/ui-evidence/minhsatori-native-home.png
            test -s android/ui-evidence/minhsatori-native-home.png
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MinhSatori-Android-v0.3.2-Visual-Sandbox-Evidence
          path: android/ui-evidence/minhsatori-native-home.png
          if-no-files-found: warn
          retention-days: 7
