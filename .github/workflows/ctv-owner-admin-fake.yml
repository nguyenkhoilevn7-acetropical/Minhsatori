name: Collaborator Pair Admin Offline
on:
  pull_request:
    paths:
      - 'customer-ai-chat-prototype/owner-collaborator-pairs.mjs'
      - 'customer-ai-chat-prototype/server.mjs'
      - 'customer-ai-chat-prototype/admin.html'
      - 'customer-ai-chat-prototype/tests/owner-collaborator-pairs.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check customer-ai-chat-prototype/server.mjs
      - run: node customer-ai-chat-prototype/tests/owner-collaborator-pairs.test.mjs
