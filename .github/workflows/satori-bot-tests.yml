name: Satori Bot Safety Tests
on:
  pull_request:
    paths:
      - "satori-bot-live.js"
      - "index.html"
      - "tests/satori-bot-live.test.js"
  push:
    branches:
      - "feature/satori-bot-live-ui"
permissions:
  contents: read
jobs:
  bot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline bot tests
        run: node --test tests/satori-bot-live.test.js
